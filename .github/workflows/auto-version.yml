name: Auto Version Bump & Tag

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run version update script
        id: update_version
        run: |
          python .github/scripts/update_versions.py

      - name: Commit and Push changes
        if: steps.update_version.outputs.config_changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "chore: auto bump versions [skip ci]"
          git push

      - name: Create and Push Tag
        if: steps.update_version.outputs.new_tag != ''
        run: |
          TAG_NAME=${{ steps.update_version.outputs.new_tag }}
          echo "Creating tag: $TAG_NAME"
          git tag $TAG_NAME || echo "Tag already exists locally"
          git push origin $TAG_NAME || echo "Tag already exists on remote, skipping"
